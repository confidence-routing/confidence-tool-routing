name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The harness is stdlib-only by design (see requirements.txt), so
      # pytest is the single install. Nothing else should appear here
      # until a phase actually needs a dependency at runtime.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: python -m pytest tests/ -v

      # Every test file also ships a run_all() entry point so the suite
      # works on a machine without pytest. That path is easy to break
      # without noticing, so exercise it too.
      - name: Run standalone test runners (no pytest)
        run: |
          for f in tests/test_*.py; do
            python -m "tests.$(basename "$f" .py)"
          done

      - name: Smoke-test the example run
        run: python -m examples.dummy_run

  # Reports how stale the hand-maintained pricing table is. Deliberately
  # non-blocking: costs.py already warns at runtime, and a hard failure
  # here would turn one un-bumped date into a red build on every branch
  # for reasons unrelated to the change under test. See the discussion in
  # PR #1 about running the suite under -W error.
  pricing-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Report pricing table age
        run: |
          python - <<'PY'
          import datetime
          from eval_harness.costs import (
              PRICING_VERIFIED_DATE,
              STALENESS_THRESHOLD_DAYS,
          )

          age = (datetime.date.today() - PRICING_VERIFIED_DATE).days
          print(f"PRICING_VERIFIED_DATE: {PRICING_VERIFIED_DATE.isoformat()}")
          print(f"age: {age} days (threshold {STALENESS_THRESHOLD_DAYS})")

          if age > STALENESS_THRESHOLD_DAYS:
              print(
                  "::warning title=Stale pricing table::"
                  f"PRICING_TABLE was last verified {age} days ago. "
                  "CPST numbers may be inaccurate. Verify rates at "
                  "https://openai.com/api/pricing and update "
                  "PRICING_VERIFIED_DATE in eval_harness/costs.py."
              )
          PY
